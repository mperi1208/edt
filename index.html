<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="supported-color-schemes" content="light">
<meta name="apple-mobile-web-app-title" content="EDT">
<meta name="theme-color" content="#f6f7f9">
<link rel="apple-touch-icon" href="icon.png">
<title>EDT</title>
<style>
:root{
  /* Interface volontairement TOUJOURS claire : pas de bascule en mode sombre,
     ni sur le Mac ni sur le téléphone. color-scheme fige aussi les contrôles
     du navigateur (champs, ascenseurs) en clair. */
  color-scheme: light;
  --bg:#f6f7f9; --fg:#1b1b19; --dim:#8a8a84; --line:#e3e6ec; --card:#fff;
  --today:#eef2ff; --shadow:none;
  --h:62px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}

header{display:flex;align-items:center;gap:14px;padding:14px 18px 12px;flex:0 0 auto}
h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.range{color:var(--dim);font-variant-numeric:tabular-nums}
.sp{flex:1}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:7px;padding:4px 10px;cursor:pointer;line-height:1.3}
button:hover{background:var(--card)}
a.btn{font:inherit;color:var(--fg);text-decoration:none;border:1px solid var(--line);
  border-radius:7px;padding:4px 10px;line-height:1.3;white-space:nowrap}
a.btn:hover{background:var(--card)}
button.icon{padding:4px 9px}
.meta{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.meta.stale{color:#c0392b;font-weight:600}

.wrap{flex:1;overflow-y:auto;padding:0 18px 22px}
.grid{display:grid;gap:0 8px;position:relative}
.dayhead{position:sticky;top:0;z-index:3;background:var(--bg);padding:2px 0 8px;text-align:left}
.dayhead .dw{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.dayhead .dd{font-size:17px;font-weight:700;letter-spacing:-.02em}
.dayhead.is-today .dd{color:#e0562d}
.corner{position:sticky;top:0;z-index:3;background:var(--bg)}

.col{position:relative;height:calc(var(--h) * var(--hours));border-left:1px solid var(--line)}
.col.is-today{background:var(--today)}
.axis{position:relative;height:calc(var(--h) * var(--hours))}
.axis span{position:absolute;right:8px;transform:translateY(-6px);font-size:10.5px;
  color:var(--dim);font-variant-numeric:tabular-nums}
.hline{position:absolute;left:0;right:0;border-top:1px solid var(--line);
  border-top-color:color-mix(in srgb, var(--line) 60%, transparent);pointer-events:none}

.ev{position:absolute;left:2px;right:2px;border-radius:9px;padding:5px 7px 4px;
  overflow:hidden;background:var(--card);          /* repli si color-mix absent */
  background:color-mix(in srgb, var(--c) 16%, var(--card));
  box-shadow:none;border:none;border-left:4px solid var(--c);cursor:default}
.ev .hd{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ev .t{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
.ev .n{font-weight:700;letter-spacing:-.01em;margin:2px 0 1px;font-size:11.8px;line-height:1.25;
  color:var(--fg);color:color-mix(in srgb, var(--c) 72%, var(--fg))}
.ev .r{font-size:11px;color:var(--dim)}
.ev .b{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.04em;
  color:#fff;background:var(--bc);border:1px solid var(--bc);border-radius:4px;
  padding:1px 6px;opacity:.95;flex:0 0 auto}
.ev.short{padding-top:3px}
.ev.short .n{font-size:11px}
.ev.short .r{display:none}

/* secondaires : présents mais très en retrait */
/* Discrets, mais leur étendue doit rester lisible : sans fond ni bordure visible,
   un bloc de 3 h se lit comme un bloc d'1 h.
   L'opacité porte sur le CONTENU seulement — sur le bloc entier, elle rendrait le fond
   translucide et les lignes d'heures traverseraient la carte. */
.ev.sec{background:var(--card);box-shadow:none;border:1px dashed var(--line);
  border-left:4px dashed var(--dim);opacity:1}
.ev.sec .n{color:var(--fg)}
.ev.sec>*{opacity:.45}
.ev.sec .n{font-weight:500}
.ev.sec .b{display:none}
body.hide-sec .ev.sec{display:none}

.now{position:absolute;left:0;right:0;height:0;border-top:1.5px solid #e0562d;z-index:2}
.now::before{content:"";position:absolute;left:-3px;top:-3.5px;width:6px;height:6px;
  border-radius:50%;background:#e0562d}

.empty{color:var(--dim);padding:40px 0;text-align:center}

/* ---- édition ---- */
body.can-edit .ev,body.can-edit .dcard{cursor:pointer}
.ev.perso,.dcard.perso{border-left-width:3px;border-left-style:solid}
.ev.perso .n::after,.dcard.perso .ttl::after{content:" ●";color:var(--c);font-size:9px;vertical-align:middle}
.ev.modif .n::after,.dcard.modif .ttl::after{content:" ✎";color:var(--dim);font-size:10px}
#add{display:none}
button.busy{opacity:.55;pointer-events:none}
body.can-edit #add{display:inline-block}
#unhide[hidden]{display:none}
#hiddenList .h{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
#hiddenList .h span{flex:1;min-width:0}

.ovl{position:fixed;inset:0;background:rgba(0,0,0,.34);display:flex;align-items:center;
  justify-content:center;padding:18px;z-index:50}
.ovl[hidden]{display:none}
.dlg{background:var(--bg);border:1px solid var(--line);border-radius:14px;width:min(420px,100%);
  max-height:90vh;overflow:auto;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.dlg h2{margin:0 0 14px;font-size:15px;font-weight:600}
.dlg label{display:block;font-size:11px;color:var(--dim);margin:10px 0 3px;letter-spacing:.02em}
.dlg input,.dlg select{width:100%;font:inherit;color:var(--fg);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.dlg .row{display:flex;gap:10px}
.dlg .row>div{flex:1}
.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.acts .sp{flex:1}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
button.danger{color:#c0392b;border-color:#c0392b55}

/* ---- vue jour (téléphone) ---- */
.daylist{padding-top:2px}
.dcard{display:flex;gap:13px;padding:13px 10px 13px 11px;margin-bottom:7px;border-bottom:none;
  border-left:4px solid var(--c);border-radius:9px;
  background:var(--card);background:color-mix(in srgb, var(--c) 14%, var(--card))}
.dcard:last-child{border-bottom:0}
.dcard .when{flex:0 0 54px;font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px;line-height:1.5}
.dcard .when b{display:block;color:var(--fg);font-weight:600;font-size:15px;letter-spacing:-.02em}
.dcard .bd{flex:1;min-width:0}
  .dcard .ttl{font-weight:700;font-size:15px;letter-spacing:-.015em;line-height:1.3;
  color:var(--fg);color:color-mix(in srgb, var(--c) 70%, var(--fg))}
.dcard .sub{font-size:13px;color:var(--dim);margin-top:2px}
.dcard .bg{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.04em;margin-top:5px;
  color:#fff;background:var(--bc);border:1px solid var(--bc);border-radius:4px;padding:1px 6px}
.dcard.sec{opacity:1;background:var(--card);border-left-style:dashed}
.dcard.sec .ttl{color:var(--fg)}
.dcard.sec>*{opacity:.42}
.dcard.sec .bg{display:none}
.dcard.past{opacity:.4}
.dcard.ongoing{background:var(--today)}
body.hide-sec .dcard.sec{display:none}

body.day .wrap{padding:0 16px 28px}
body.day .grid{display:block}
body.day header{padding:14px 16px 10px;flex-wrap:wrap;gap:9px;align-items:baseline}
body.day .sp{flex:0 0 100%;height:0}          /* force les boutons sur leur propre ligne */
body.day #prev,body.day #today,body.day #next{flex:0 0 auto}
body.day h1{font-size:14px}
body.day .range{font-size:13px}
body.day #togglesec{display:none}
@media (max-width:700px){
  button,a.btn{padding:6px 12px}
  body.day .meta{margin-left:auto}
}
</style>

<header>
  <h1>EDT</h1>
  <span class="range" id="range"></span>
  <span class="sp"></span>
  <span class="meta" id="meta"></span>
  <button class="icon" id="prev" title="Semaine précédente">←</button>
  <button id="today">Aujourd'hui</button>
  <button class="icon" id="next" title="Semaine suivante">→</button>
  <button id="refresh" title="Forcer une mise à jour depuis Celcat">↻</button>
  <button id="add" title="Ajouter un créneau">+</button>
  <button id="unhide" title="Séances masquées" hidden>Masquées</button>
  <button id="togglesec" title="Afficher ou masquer les créneaux secondaires">Secondaires</button>
  <a class="btn" id="site" href="https://edt.uvsq.fr/" target="_blank" rel="noopener"
     title="Ouvrir l'emploi du temps officiel sur edt.uvsq.fr">Site UVSQ ↗</a>
</header>
<div class="wrap"><div class="grid" id="grid"></div></div>

<div class="ovl" id="ovl" hidden><div class="dlg">
  <h2 id="dlgTitle">Modifier</h2>
  <label>Intitulé</label><input id="fTitle" placeholder="Nom du créneau">
  <label>Salle / lieu</label><input id="fRoom" placeholder="Facultatif">
  <div class="row">
    <div><label>Date</label><input id="fDate" type="date"></div>
    <div><label>Type</label><select id="fCat">
      <option>Perso</option><option>CM/TD</option><option>CM</option><option>TD</option>
      <option>Contrôle continu</option><option>Séminaire</option><option value="">(aucun)</option>
    </select></div>
  </div>
  <div class="row">
    <div><label>Début</label><input id="fStart" type="time"></div>
    <div><label>Fin</label><input id="fEnd" type="time"></div>
  </div>
  <div class="acts">
    <button class="primary" id="bSave">Enregistrer</button>
    <button id="bReset">Réinitialiser</button>
    <span class="sp"></span>
    <button class="danger" id="bDel">Supprimer</button>
    <button id="bCancel">Annuler</button>
  </div>
</div></div>

<div class="ovl" id="ovl2" hidden><div class="dlg">
  <h2>Séances masquées</h2>
  <div id="hiddenList"></div>
  <div class="acts"><span class="sp"></span><button id="bClose2">Fermer</button></div>
</div></div>

    root=document.createElement("div"); root.className="mapovl"; root.hidden=true;

  function which(room){
    if(!room) return null;
    const r=String(room).toUpperCase();
    for(const k of ["DESCARTES","LAVOISIER","GERMAIN","FERMAT","BUFFON"]) if(r.includes(k)) return k;
    if(/JOLIOT/.test(r)) return "JOLIOT";
    if(/\bBU\b/.test(r)) return "BU";
    return null;
  }
  return {
    has: room => !!which(room),
    open(room,color){
      const k=which(room); if(!k) return;
      build();
      svgEl.querySelectorAll(".mp-b").forEach(p=>{ p.classList.remove("on"); p.style.fill=""; });
      const p=svgEl.querySelector("#mp-"+k); p.classList.add("on"); p.style.fill=color||"#e0562d";

<script>
// Seules les OPTIONS non choisies sont grisées (cf. maquette M1 AMS, BCC 3).
// Tout le reste — cours obligatoires, y compris ceux du S2 pas encore publiés,
// forum, projet de groupe, pré-rentrée — s'affiche normalement.
const MUTED_MODULES = [
  "MYMAA002",   // Introduction au calcul formel
  "MYCHP104",   // Programmation orientée objet (Guyancourt)
  "MYMAA008",   // Théorie de l'information (S2) — finalement pas choisie
  "MYCHP200"    // Optimisation et recherche opérationnelle (S2, Guyancourt)
];              // Analyse d'algorithmes (MYMAA006) est choisie : pas grisée.
const MUTED_TITLES  = [
  /MYCHP104|Programmation Orient/i,   // les cours de Guyancourt n'ont pas de code module dans Celcat,
  /MYCHP200|recherche op[ée]rationnelle/i,  // seulement dans l'intitulé
  /MYMAA008|th[ée]orie de l.information/i,
  /TRAJET/i                           // navette Versailles–Guyancourt, liée à la POO
];
const COLORS = {
  MYANM007:"#2f7ae5", MYANM001:"#d2691e", MYANM009:"#7b53c1", MYMAS001:"#1f9e6e",
  MYANM011:"#c2417a", MSANGS1:"#4b7f52",  MYMAS006:"#8a7a2f"
};
// Couleur du badge par type de séance (indépendante de la couleur du module)
const CAT_COLORS = {
  "CM/TD": "#5b7ca8",          // le cas courant : bleu ardoise, discret
  "CM":    "#1f9e6e",          // cours magistral seul : vert
  "TD":    "#a8790f",          // TD seul : ambre, distinct du CM
  "Contrôle continu": "#c0392b",
  "CC":    "#c0392b",
  "Séminaire": "#7b53c1",
  "Perso":  "#0f8b8d",
  "Réunion de pré-rentrée": "#8a8a84",
  "Pré-rentrée": "#8a8a84"
};
const esc = v => String(v==null?"":v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const catColor = c => CAT_COLORS[c] || "#8a8a84";

const DAY_START = 8, DAY_END = 20;

const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseLocal = s => { const [d,t]=s.split("T"); const [Y,M,D]=d.split("-").map(Number);
  const [h,m]=t.split(":").map(Number); return new Date(Y,M-1,D,h,m); };
const minutes = d => d.getHours()*60 + d.getMinutes();

let DATA = null, cursor = null;
let OVER = (window.EDT_OVERRIDES) || {custom:[], edits:{}, hidden:[]};
let ALL = [];
const canEdit = !!window.EDT_CAN_EDIT;

// Mémoire du téléphone (jeton GitHub, heure de la dernière vérification réussie).
// Reste sur l'appareil : rien de tout ça n'est publié.
const CLE = { jeton:"edt.jeton", verif:"edt.verifie", essai:"edt.essai" };
let statutMaj = null;   // {txt, erreur} tant qu'une mise à jour est en cours ou a échoué
const mem = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} }
};

// Les modifications vivent à part : data.json est réécrit en entier deux fois par jour.
function rebuild(){
  OVER.custom = OVER.custom || []; OVER.edits = OVER.edits || {}; OVER.hidden = OVER.hidden || [];
  const cache = new Set(OVER.hidden);
  const base = ((DATA && DATA.sessions) || [])
    .filter(s => !cache.has(s.id))
    .map(s => { const e = OVER.edits[s.id]; return e ? {...s, ...e, modif:true} : s; });
  ALL = base.concat(OVER.custom.map(s => ({...s, perso:true})));
  if (typeof majUnhide === "function") majUnhide();
}

function saveOver(){
  rebuild(); render();
  try {
    if (window.webkit && webkit.messageHandlers && webkit.messageHandlers.edt)
      webkit.messageHandlers.edt.postMessage({type:"overrides", data: JSON.parse(JSON.stringify(OVER))});
  } catch(e){ console.warn("sauvegarde impossible", e); }
}
const isNarrow = () => window.innerWidth < 700;

function mondayOf(d){ const x=new Date(d); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; }

function labelFor(s){
  let t = (s.title || "").trim().replace(/^\[|\]$/g, "").trim();
  t = t.replace(/^[A-Z]{2,}[A-Z0-9_]*\s*[-_\u2013]\s*/, "");   // "MYCHP104 _ Programmation…"
  t = t.replace(/^CRENEAU RESERVE AU /i, "Créneau ");
  if (t) t = t.charAt(0).toUpperCase() + t.slice(1);
  return t || s.category || "—";
}
const isMuted = s => (s.module && MUTED_MODULES.includes(s.module))
                  || MUTED_TITLES.some(r => r.test(s.title || ""));
const isPrimary = s => !isMuted(s);

// Couleur de la barre : fixe pour les matières connues, stable (hachage) pour les
// futures, neutre pour les créneaux sans module (forum, projet…).
const EXTRA = ["#0f8b8d","#b5523b","#5a67d8","#9c6b30","#2e7d32","#ad3f8f"];
function colorFor(s){
  if (s.perso) return "#0f8b8d";
  if (s.module && COLORS[s.module]) return COLORS[s.module];
  if (!s.module) return "#6b7a8c";
  let h = 0; for (const c of s.module) h = (h*31 + c.charCodeAt(0)) >>> 0;
  return EXTRA[h % EXTRA.length];
}

function layout(list){                    // colonnes pour les chevauchements
  const sorted=[...list].sort((a,b)=>a.s-b.s||a.e-b.e);
  let cols=[], groupe=[], fin=-1;
  const clore=()=>{ groupe.forEach(ev=>ev.ncols=cols.length); cols=[]; groupe=[]; };
  sorted.forEach(ev=>{
    if(groupe.length && ev.s>=fin) clore();      // plus de chevauchement : nouveau groupe
    fin=groupe.length?Math.max(fin,ev.e):ev.e; groupe.push(ev);
    let placed=false;
    for(let i=0;i<cols.length;i++){
      if(cols[i][cols[i].length-1].e <= ev.s){ cols[i].push(ev); ev.col=i; placed=true; break; }
    }
    if(!placed){ ev.col=cols.length; cols.push([ev]); }
  });
  clore();
  return sorted;
}

function sessionsOn(d){
  const k=ymd(d);
  return ALL.filter(s=>s.start.startsWith(k))
    .sort((a,b)=>a.start<b.start?-1:1);
}

// Sur un jour vide (week-end, vacances) on saute au prochain jour qui a cours.
function firstDayWithCourses(from){
  const d=new Date(from);
  for(let i=0;i<21;i++){ if(sessionsOn(d).length) return d; d.setDate(d.getDate()+1); }
  return from;
}

// Le jour à ouvrir : aujourd'hui tant qu'il reste un cours à venir,
// sinon on passe directement au prochain jour de cours.
function dayToOpen(){
  const now=new Date();
  const reste=sessionsOn(now).some(s=>parseLocal(s.end)>now);
  if(reste) return now;
  const d=new Date(now); d.setDate(d.getDate()+1);
  return firstDayWithCourses(d);
}

function renderDay(){
  const grid=document.getElementById("grid");
  const list=sessionsOn(cursor), now=new Date(), today=ymd(now);
  const f=new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  let t=f.format(cursor); t=t.charAt(0).toUpperCase()+t.slice(1);
  const dd=new Date(cursor), tm=new Date(); tm.setDate(tm.getDate()+1);
  let suffixe="";
  if(ymd(dd)===today) suffixe="  ·  aujourd'hui";
  else if(ymd(dd)===ymd(tm)) suffixe="  ·  demain";
  document.getElementById("range").textContent = t + suffixe;

  if(!list.length){ grid.innerHTML='<div class="empty">Aucun cours ce jour-là.</div>'; return; }

  let h='<div class="daylist">';
  list.forEach(s=>{
    const a=parseLocal(s.start), b=parseLocal(s.end);
    const prim=isPrimary(s), c=prim?colorFor(s):"var(--dim)";
    const isToday=ymd(cursor)===today;
    const ongoing=isToday && a<=now && now<b, past=isToday && b<=now;
    const cat=(s.category||"").replace("Contrôle continu","CC").replace("Réunion de pré-rentrée","Pré-rentrée");
    h+=`<div class="dcard${prim?"":" sec"}${ongoing?" ongoing":""}${past?" past":""}${s.perso?" perso":""}${s.modif?" modif":""}" data-id="${esc(s.id)}" style="--c:${c}">
      <div class="when"><b>${pad(a.getHours())}:${pad(a.getMinutes())}</b>${pad(b.getHours())}:${pad(b.getMinutes())}</div>
      <div class="bd">
        <div class="ttl">${esc(labelFor(s))}</div>
        ${s.room?`<div class="sub">${esc(s.room)}${s.teacher?" · "+esc(s.teacher):""}</div>`:(s.teacher?`<div class="sub">${esc(s.teacher)}</div>`:"")}
        ${cat?`<span class="bg" style="--bc:${catColor(cat)}">${esc(cat)}</span>`:""}
      </div>${mapBtn(s.room)}</div>`;
  });
  grid.innerHTML=h+"</div>";
}

// Petit logo « voir sur le plan » (seulement si la salle est dans un bâtiment du campus)
function mapBtn(room){
  if(!room || !window.EDTPlan || !EDTPlan.has(room)) return "";
  return `<button class="mapbtn" data-room="${esc(room)}" aria-label="Voir sur le plan" title="Voir sur le plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></button>`;
}

function render(){
  const grid=document.getElementById("grid");
  if(!DATA){ grid.innerHTML='<div class="empty">Chargement…</div>'; return; }
  document.body.classList.toggle("day", isNarrow());
  if(isNarrow()){ renderDay(); stampMeta(); return; }

  const start=mondayOf(cursor);
  const byDay={}; let maxDay=4;
  ALL.forEach(s=>{
    const sd=parseLocal(s.start), ed=parseLocal(s.end);
    const k=ymd(sd);
    (byDay[k]=byDay[k]||[]).push({...s,s:minutes(sd),e:minutes(ed),sd,ed});
  });
  for(let i=5;i<7;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    if((byDay[ymd(d)]||[]).length) maxDay=i;
  }
  const ndays=maxDay+1, hours=DAY_END-DAY_START;
  grid.style.gridTemplateColumns = "44px repeat("+ndays+", minmax(0,1fr))";
  document.documentElement.style.setProperty("--hours",hours);

  const end=new Date(start); end.setDate(end.getDate()+ndays-1);
  const fmt=new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"long"});
  document.getElementById("range").textContent=fmt.format(start)+" – "+fmt.format(end)+" "+end.getFullYear();

  let html='<div class="corner"></div>';
  const today=ymd(new Date());
  for(let i=0;i<ndays;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    const dw=new Intl.DateTimeFormat("fr-FR",{weekday:"short"}).format(d).replace(".","");
    html+=`<div class="dayhead${ymd(d)===today?" is-today":""}"><div class="dw">${dw}</div><div class="dd">${d.getDate()}</div></div>`;
  }
  html+='<div class="axis">';
  for(let h=DAY_START;h<=DAY_END;h++) html+=`<span style="top:${(h-DAY_START)*62}px">${h}h</span>`;
  html+='</div>';

  const nowD=new Date();
  for(let i=0;i<ndays;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    const key=ymd(d), isToday=key===today;
    html+=`<div class="col${isToday?" is-today":""}">`;
    for(let h=DAY_START;h<=DAY_END;h++) html+=`<div class="hline" style="top:${(h-DAY_START)*62}px"></div>`;
    if(isToday){
      const m=minutes(nowD);
      if(m>=DAY_START*60&&m<=DAY_END*60) html+=`<div class="now" style="top:${(m-DAY_START*60)/60*62}px"></div>`;
    }
    layout(byDay[key]||[]).forEach(ev=>{
      const s0=Math.max(ev.s,DAY_START*60), e0=Math.min(ev.e,DAY_END*60);
      if(e0<=s0) return;
      const top=(s0-DAY_START*60)/60*62, h=Math.max(22,(e0-s0)/60*62-3);
      const prim=isPrimary(ev), c=prim?colorFor(ev):"var(--dim)";
      const w=100/ev.ncols, left=ev.col*w;
      const cat=(ev.category||"").replace("Contrôle continu","CC").replace("Réunion de pré-rentrée","Pré-rentrée");
      html+=`<div class="ev${prim?"":" sec"}${h<46?" short":""}${ev.perso?" perso":""}${ev.modif?" modif":""}" data-id="${esc(ev.id)}" style="--c:${c};top:${top}px;height:${h}px;left:calc(${left}% + 2px);width:calc(${w}% - 4px)" title="${esc(ev.title||"")}${ev.room?" — "+esc(ev.room):""}">
        <div class="hd">
          <span class="t">${pad(ev.sd.getHours())}:${pad(ev.sd.getMinutes())}–${pad(ev.ed.getHours())}:${pad(ev.ed.getMinutes())}</span>
          ${cat?`<span class="b" style="--bc:${catColor(cat)}">${esc(cat)}</span>`:""}
        </div>
        <div class="n">${esc(labelFor(ev))}</div>
        ${ev.room?`<div class="r">${esc(ev.room)}${ev.teacher?" · "+esc(ev.teacher):""}</div>`:(ev.teacher?`<div class="r">${esc(ev.teacher)}</div>`:"")}
        ${mapBtn(ev.room)}
      </div>`;
    });
    html+="</div>";
  }
  grid.innerHTML=html;

  stampMeta();
}

function stampMeta(){
  // Lien vers le site officiel, sur la date actuellement affichée.
  const jour = ymd(cursor || new Date());
  document.getElementById("site").href =
    "https://edt.uvsq.fr/cal?vt=agendaWeek&dt=" + jour + "&et=group&fid0=MYAMS1_26";

  const el = document.getElementById("meta");
  // Une mise à jour en cours ou en échec reste affichée : sans ça, le redessin de chaque
  // minute effacerait « mise à jour… » ou la raison de l'échec avant qu'on l'ait lue.
  if (statutMaj) {
    el.textContent = statutMaj.txt;
    el.classList.toggle("stale", !!statutMaj.erreur);
    if (statutMaj.erreur) el.title = statutMaj.erreur;
    return;
  }
  if(!DATA || !DATA.fetchedAt){ el.textContent=""; return; }
  const f = new Date(DATA.fetchedAt), now = new Date();
  // L'alerte doit se baser sur la dernière VÉRIFICATION, jamais sur le dernier
  // changement : un emploi du temps stable pendant une semaine est normal, pas périmé.
  // checkedAt est publié dans data.json, donc exploitable aussi côté téléphone.
  // Mais une vérification sans changement n'est pas republiée : le téléphone retient
  // donc lui-même l'heure de sa dernière vérification réussie, et on garde la plus récente.
  let controle = DATA.checkedAt ? new Date(DATA.checkedAt) : f;
  const local = canEdit ? null : mem.get(CLE.verif);
  const verifLocale = local && !isNaN(new Date(local)) && new Date(local) > controle;
  if (verifLocale) controle = new Date(local);
  const seuil = DATA.checkedAt ? (canEdit ? 26 : 30) * 3600 * 1000
                               : 7 * 24 * 3600 * 1000;   // vieux fichier sans checkedAt
  const memeJour = ymd(f) === ymd(now);
  let txt = "maj " + (memeJour ? "" : pad(f.getDate())+"/"+pad(f.getMonth()+1)+" ")
          + pad(f.getHours())+":"+pad(f.getMinutes());
  // Sur le Mac, on montre AUSSI l'heure de la dernière vérification : sans ça, un
  // emploi du temps inchangé donne l'impression que le bouton ne fait rien.
  if ((canEdit && DATA.checkedAt) || verifLocale) {
    const c = controle;
    txt += " · vérifié " + (ymd(c) === ymd(now) ? "" : pad(c.getDate())+"/"+pad(c.getMonth()+1)+" ")
         + pad(c.getHours()) + ":" + pad(c.getMinutes());
  }
  el.textContent = txt;
  // Les mises à jour ne se font plus qu'à la demande : au-delà du seuil, personne n'a
  // vérifié depuis longtemps (ou la vérification échoue). Ça doit se voir.
  const vieux = (now - controle) > seuil;
  el.classList.toggle("stale", vieux);
  el.title = vieux ? "Données anciennes : aucune vérification réussie depuis plus d'un jour."
                   : "Dernier changement de l'emploi du temps"
                     + (DATA.checkedAt ? " — vérifié à " + pad(new Date(DATA.checkedAt).getHours())
                        + ":" + pad(new Date(DATA.checkedAt).getMinutes()) : "");
}

// --- mise à jour depuis le téléphone, sans le Mac ---
// La page ne peut pas interroger Celcat elle-même (session UVSQ, autre site). Elle demande
// donc à GitHub de le faire : elle lance le workflow « maj.yml », attend sa fin, puis relit
// les données. Il lui faut un jeton GitHub limité à ce dépôt (droit « Actions » en écriture),
// saisi une fois sur le téléphone et jamais publié. Sans jeton, on relit ce qui est publié.
const GH = "https://api.github.com/repos/mperi1208/edt";
const WF = GH + "/actions/workflows/maj.yml";
const DELAI_AUTO = 2 * 60 * 1000;      // pas deux lancements automatiques coup sur coup
const ATTENTE_MAX = 4 * 60 * 1000;
let majEnCours = false;
const pause = ms => new Promise(r => setTimeout(r, ms));
const erreurJeton = () => Object.assign(new Error("jeton refusé"), {jeton:true});

function gh(url, opt){
  // no-store indispensable : GitHub autorise 60 s de cache, on relirait le même état en boucle.
  return fetch(url, {...(opt||{}), cache:"no-store", headers:{
    "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28",
    "Authorization":"Bearer " + mem.get(CLE.jeton)}});
}

// Les derniers lancements, du plus récent au plus ancien.
// Le dépôt est public : ici seul un 401 dénonce le jeton. Un 403 est une limite de débit,
// et effacer pour ça un jeton que GitHub n'affiche qu'une fois serait une punition.
async function lancements(){
  const r = await gh(WF + "/runs?per_page=5&event=workflow_dispatch&t=" + Date.now());
  if (r.status === 401) throw erreurJeton();
  if (r.status === 404) throw new Error("workflow introuvable");
  if (r.status === 403 || r.status === 429) throw new Error("GitHub limite les requêtes");
  if (!r.ok) throw new Error("GitHub " + r.status);
  return (await r.json()).workflow_runs || [];
}

// Attend la fin du premier lancement de numéro > n0 (le nôtre, pas celui d'un autre appareil
// arrivé après).
async function attendre(n0){
  const limite = Date.now() + ATTENTE_MAX;
  for (;;) {
    await pause(4000);
    // On relit TOUJOURS une fois après la pause : si le téléphone a mis la page en veille
    // entre-temps, l'heure limite est dépassée alors que le travail est peut-être fini.
    let liste = null;
    try { liste = await lancements(); }
    catch(e) { if (e.jeton) throw e; }   // coupure passagère (veille iOS, métro) : on insiste
    const run = liste && liste.filter(x => x.run_number > n0)
                              .sort((a,b) => a.run_number - b.run_number)[0];
    if (run && run.status === "completed") {
      // Annulé = remplacé dans la file par un lancement plus récent : on attend celui-là.
      if (run.conclusion === "cancelled") { n0 = run.run_number; continue; }
      if (run.conclusion !== "success") throw new Error("Celcat injoignable depuis GitHub");
      return;
    }
    if (Date.now() > limite) throw new Error(liste ? "GitHub ne répond pas" : "pas de réseau");
  }
}

async function demarrer(){
  const d = await gh(WF + "/dispatches", {method:"POST", body: JSON.stringify({ref:"main"})});
  if (d.ok) return;
  const debit = d.status === 429 || (d.status === 403 && d.headers.get("x-ratelimit-remaining") === "0");
  if (debit) throw new Error("GitHub limite les requêtes");
  // La liste vient d'être lue avec succès, donc le workflow existe : un refus ici vient du
  // jeton (expiré, ou sans le droit « Actions » en écriture sur ce dépôt).
  if (d.status === 401 || d.status === 403 || d.status === 404) throw erreurJeton();
  throw new Error("GitHub " + d.status);
}

// Le site publié met environ une minute à suivre un commit : on lit le fichier dans le dépôt,
// avec le jeton s'il y en a un (sans lui, le quota est de 60 lectures par heure et par
// adresse IP, vite épuisé sur un Wi-Fi partagé). `frais` dit si la lecture vient du dépôt.
async function lireDonnees(){
  const url = GH + "/contents/data.json?ref=main&t=" + Date.now();
  const brut = {"Accept":"application/vnd.github.raw+json"};
  const essais = mem.get(CLE.jeton) ? [{...brut, "Authorization":"Bearer " + mem.get(CLE.jeton)}, brut] : [brut];
  for (const headers of essais) {
    try {
      const r = await fetch(url, {cache:"no-store", headers});
      if (r.ok) return {d: await r.json(), frais: true};
    } catch(e) {}
  }
  const r = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return {d: await r.json(), frais: false};
}

function saisirJeton(){
  const s = (prompt("Pour mettre à jour depuis ce téléphone, colle ici le jeton GitHub (demandé une seule fois).\nAnnuler : recharger seulement ce qui est déjà publié.") || "").trim();
  if (!s) return;
  // Un caractère parasite (guillemet, espace insécable) rendrait l'en-tête invalide à vie.
  if (/^[A-Za-z0-9_]+$/.test(s)) mem.set(CLE.jeton, s);
  else alert("Ce texte ne ressemble pas à un jeton GitHub : il n'a pas été enregistré.");
}

// manuel = bouton ↻ ; sinon ouverture de la page ou retour dessus.
async function lancerMaj(manuel){
  if (majEnCours) return;
  if (!mem.get(CLE.jeton) && manuel) saisirJeton();
  const b = $("refresh");
  if (!mem.get(CLE.jeton)) {
    if (!manuel) return;
    majEnCours = true;
    try { applyData((await lireDonnees()).d); edtRefreshDone(true, null, "✓ données rechargées"); }
    catch(e) { edtRefreshDone(false, String(e.message || e)); }
    finally { majEnCours = false; }
    return;
  }
  majEnCours = true;
  try {
    const liste = await lancements();
    const dernier = liste[0] || null;
    const actif = !!dernier && dernier.status !== "completed";
    const recent = !manuel && Date.now() - Number(mem.get(CLE.essai) || 0) < DELAI_AUTO;
    if (!actif && recent) {
      // Vérifié il y a moins de 2 min : inutile de relancer, mais on relit quand même,
      // car la page a pu être rechargée par iOS avant d'avoir vu le résultat.
      applyData((await lireDonnees()).d);
      return;
    }
    b.classList.add("busy");
    majStatut("mise à jour… (1 à 2 min)", false);
    if (actif) {
      // Un lancement tourne déjà (le nôtre d'avant un rechargement, ou un autre appareil) :
      // on s'y rattache au lieu d'en empiler un second.
      const actifs = liste.filter(x => x.status !== "completed").map(x => x.run_number);
      await attendre(Math.min(...actifs) - 1);
    } else {
      await demarrer();
      mem.set(CLE.essai, String(Date.now()));
      await attendre(dernier ? dernier.run_number : 0);
    }
    const lu = await lireDonnees();
    mem.set(CLE.verif, new Date().toISOString());
    applyData(lu.d);
    edtRefreshDone(true);
    // Lecture retombée sur le site publié, en retard d'une minute sur le dépôt : on repasse.
    if (!lu.frais) setTimeout(() => lireDonnees().then(x => applyData(x.d)).catch(() => {}), 75000);
  } catch(e) {
    if (e.jeton) mem.set(CLE.jeton, null);      // il sera redemandé au prochain ↻
    mem.set(CLE.essai, null);                   // un échec ne doit pas bloquer le prochain retour
    b.classList.remove("busy");
    // Sur téléphone il n'y a pas d'infobulle : la raison doit être dans le texte.
    majStatut("échec : " + (e.jeton ? "jeton refusé, touche ↻" : String(e.message || e)), String(e.message || e));
  } finally { majEnCours = false; }
}

// Revenir sur la page sans l'avoir fermée doit aussi vérifier (sur le Mac, c'est l'app
// qui s'en charge, voir applicationDidBecomeActive).
if (!(window.webkit && webkit.messageHandlers && webkit.messageHandlers.edt)) {
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && DATA) lancerMaj(false);
  });
}

document.getElementById("grid").addEventListener("click", e => {
  const mb = e.target.closest(".mapbtn");
  if (mb) {                       // plan du campus : ne pas ouvrir l'éditeur du cours
    e.stopPropagation();
    const card = mb.closest("[data-id]");
    // cours secondaire (grisé) : sa « couleur » est un gris, invisible sur un plan gris
    const col = card.classList.contains("sec") ? "#e0562d" : (getComputedStyle(card).getPropertyValue("--c").trim() || "#e0562d");
    EDTPlan.open(mb.getAttribute("data-room"), col);
    return;
  }
  const el = e.target.closest("[data-id]");
  if (el) openEditor(el.getAttribute("data-id"));
});

addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("ovl2").hidden) $("ovl2").hidden = true;
  else if (e.key === "Escape" && !$("ovl").hidden) closeEditor();
  else if (e.key === "Enter" && !$("ovl").hidden && (e.target||{}).tagName !== "BUTTON") $("bSave").click();
});

window.applyOverrides = function(o){ OVER = o || OVER; rebuild(); render(); };

window.applyData = function(d){
  DATA=d;
  rebuild();
  // Même règle dans les deux vues : on ouvre sur le prochain jour de cours.
  // Sinon, le week-end, la vue semaine resterait sur la semaine écoulée.
  if(!cursor) cursor = dayToOpen();
  render();
};
if(window.EDT_DATA) applyData(window.EDT_DATA);
else {
  fetch("overrides.json?t="+Date.now(),{cache:"no-store"})
    .then(r=>r.ok?r.json():null).then(o=>{ if(o) OVER=o; }).catch(()=>{})
    .finally(()=>{
      fetch("data.json?t="+Date.now(),{cache:"no-store"})
        .then(r=>r.ok?r.json():Promise.reject(new Error("HTTP "+r.status)))
        .then(d=>{ applyData(d); lancerMaj(false); })
        .catch(e=>{document.getElementById("grid").innerHTML=
          '<div class="empty">Impossible de charger l\'emploi du temps ('+esc(e.message||e)+').<br>Vérifie la connexion puis touche ↻.</div>';});
    });
}
</script>
