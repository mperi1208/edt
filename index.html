<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EDT">
<meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#141518" media="(prefers-color-scheme:dark)">
<link rel="apple-touch-icon" href="icon.png">
<title>EDT</title>
<style>
:root{
  --bg:#fbfbf9; --fg:#1b1b19; --dim:#8a8a84; --line:#e6e5e0; --card:#fff;
  --today:#f3f1ea; --shadow:0 1px 2px rgba(0,0,0,.05);
  --h:62px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141518; --fg:#e9e9e6; --dim:#7d7f86; --line:#26282d; --card:#1b1d21;
         --today:#1f2127; --shadow:none; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}

header{display:flex;align-items:center;gap:14px;padding:14px 18px 12px;flex:0 0 auto}
h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.range{color:var(--dim);font-variant-numeric:tabular-nums}
.sp{flex:1}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:7px;padding:4px 10px;cursor:pointer;line-height:1.3}
button:hover{background:var(--card)}
button.icon{padding:4px 9px}
.meta{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}

.wrap{flex:1;overflow-y:auto;padding:0 18px 22px}
.grid{display:grid;gap:0 8px;position:relative}
.dayhead{position:sticky;top:0;z-index:3;background:var(--bg);padding:2px 0 8px;text-align:left}
.dayhead .dw{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.dayhead .dd{font-size:17px;font-weight:600;letter-spacing:-.02em}
.dayhead.is-today .dd{color:#e0562d}
.corner{position:sticky;top:0;z-index:3;background:var(--bg)}

.col{position:relative;height:calc(var(--h) * var(--hours));border-left:1px solid var(--line)}
.col.is-today{background:var(--today)}
.axis{position:relative;height:calc(var(--h) * var(--hours))}
.axis span{position:absolute;right:8px;transform:translateY(-6px);font-size:10.5px;
  color:var(--dim);font-variant-numeric:tabular-nums}
.hline{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}

.ev{position:absolute;left:2px;right:2px;border-radius:7px;padding:5px 7px 4px;
  overflow:hidden;background:var(--card);box-shadow:var(--shadow);
  border-left:3px solid var(--c);cursor:default}
.ev .hd{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ev .t{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
.ev .n{font-weight:600;letter-spacing:-.01em;margin:2px 0 1px;font-size:11.8px;line-height:1.25}
.ev .r{font-size:11px;color:var(--dim)}
.ev .b{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.04em;
  color:var(--bc);border:1px solid var(--bc);border-radius:4px;padding:0 4px;opacity:.9;flex:0 0 auto}
.ev.short{padding-top:3px}
.ev.short .n{font-size:11px}
.ev.short .r{display:none}

/* secondaires : présents mais très en retrait */
.ev.sec{background:transparent;box-shadow:none;border:1px dashed var(--line);
  border-left:1px dashed var(--line);opacity:.34}
.ev.sec .n{font-weight:500}
.ev.sec .b{display:none}
body.hide-sec .ev.sec{display:none}

.now{position:absolute;left:0;right:0;height:0;border-top:1.5px solid #e0562d;z-index:2}
.now::before{content:"";position:absolute;left:-3px;top:-3.5px;width:6px;height:6px;
  border-radius:50%;background:#e0562d}

.empty{color:var(--dim);padding:40px 0;text-align:center}

/* ---- vue jour (téléphone) ---- */
.daylist{padding-top:2px}
.dcard{display:flex;gap:13px;padding:13px 2px 13px 10px;border-bottom:1px solid var(--line);
  border-left:3px solid var(--c);border-radius:2px}
.dcard:last-child{border-bottom:0}
.dcard .when{flex:0 0 54px;font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px;line-height:1.5}
.dcard .when b{display:block;color:var(--fg);font-weight:600;font-size:15px;letter-spacing:-.02em}
.dcard .bd{flex:1;min-width:0}
.dcard .ttl{font-weight:600;font-size:15px;letter-spacing:-.015em;line-height:1.3}
.dcard .sub{font-size:13px;color:var(--dim);margin-top:2px}
.dcard .bg{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.04em;margin-top:5px;
  color:var(--bc);border:1px solid var(--bc);border-radius:4px;padding:1px 5px}
.dcard.sec{opacity:.36;border-left-style:dashed}
.dcard.sec .bg{display:none}
.dcard.past{opacity:.4}
.dcard.ongoing{background:var(--today)}
body.hide-sec .dcard.sec{display:none}

body.day .wrap{padding:0 16px 28px}
body.day .grid{display:block}
body.day header{padding:14px 16px 10px;flex-wrap:wrap;gap:9px;align-items:baseline}
body.day .sp{flex:0 0 100%;height:0}          /* force les boutons sur leur propre ligne */
body.day .meta{display:none}
body.day #prev,body.day #today,body.day #next{flex:0 0 auto}
body.day h1{font-size:14px}
body.day .range{font-size:13px}
body.day #togglesec{display:none}
@media (max-width:700px){
  header .meta{display:none}
  button{padding:6px 12px}
}
</style>

<header>
  <h1>EDT</h1>
  <span class="range" id="range"></span>
  <span class="sp"></span>
  <span class="meta" id="meta"></span>
  <button class="icon" id="prev" title="Semaine précédente">←</button>
  <button id="today">Aujourd'hui</button>
  <button class="icon" id="next" title="Semaine suivante">→</button>
  <button id="togglesec" title="Afficher ou masquer les créneaux secondaires">Secondaires</button>
</header>
<div class="wrap"><div class="grid" id="grid"></div></div>

<script>
// Seules les OPTIONS non choisies sont grisées (cf. maquette M1 AMS, BCC 3).
// Tout le reste — cours obligatoires, y compris ceux du S2 pas encore publiés,
// forum, projet de groupe, pré-rentrée — s'affiche normalement.
const MUTED_MODULES = [
  "MYMAA002",   // Introduction au calcul formel
  "MYCHP104",   // Programmation orientée objet (Guyancourt)
  "MYMAA006",   // Analyse d'algorithmes, programmation (S2)
  "MYCHP200"    // Optimisation et recherche opérationnelle (S2, Guyancourt)
];              // Théorie de l'information (MYMAA008) est choisie : pas grisée.
const MUTED_TITLES  = [
  /MYCHP104|Programmation Orient/i,   // les cours de Guyancourt n'ont pas de code module dans Celcat,
  /MYCHP200|recherche op[ée]rationnelle/i,  // seulement dans l'intitulé
  /MYMAA006|analyse d.algorithmes/i,
  /TRAJET/i                           // navette Versailles–Guyancourt, liée à la POO
];
const COLORS = {
  MYANM007:"#2f7ae5", MYANM001:"#d2691e", MYANM009:"#7b53c1", MYMAS001:"#1f9e6e",
  MYANM011:"#c2417a", MSANGS1:"#4b7f52",  MYMAS006:"#8a7a2f"
};
// Couleur du badge par type de séance (indépendante de la couleur du module)
const CAT_COLORS = {
  "CM/TD": "#5b7ca8",          // le cas courant : bleu ardoise, discret
  "CM":    "#1f9e6e",          // cours magistral seul : vert
  "TD":    "#a8790f",          // TD seul : ambre, distinct du CM
  "Contrôle continu": "#c0392b",
  "CC":    "#c0392b",
  "Séminaire": "#7b53c1",
  "Réunion de pré-rentrée": "#8a8a84",
  "Pré-rentrée": "#8a8a84"
};
const catColor = c => CAT_COLORS[c] || "#8a8a84";

const DAY_START = 8, DAY_END = 20;

const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseLocal = s => { const [d,t]=s.split("T"); const [Y,M,D]=d.split("-").map(Number);
  const [h,m]=t.split(":").map(Number); return new Date(Y,M-1,D,h,m); };
const minutes = d => d.getHours()*60 + d.getMinutes();

let DATA = null, cursor = null;
const isNarrow = () => window.innerWidth < 700;

function mondayOf(d){ const x=new Date(d); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; }

function labelFor(s){
  let t = (s.title || "").trim().replace(/^\[|\]$/g, "").trim();
  t = t.replace(/^[A-Z]{2,}[A-Z0-9_]*\s*[-_\u2013]\s*/, "");   // "MYCHP104 _ Programmation…"
  t = t.replace(/^CRENEAU RESERVE AU /i, "Créneau ");
  if (t) t = t.charAt(0).toUpperCase() + t.slice(1);
  return t || s.category || "—";
}
const isMuted = s => (s.module && MUTED_MODULES.includes(s.module))
                  || MUTED_TITLES.some(r => r.test(s.title || ""));
const isPrimary = s => !isMuted(s);

// Couleur de la barre : fixe pour les matières connues, stable (hachage) pour les
// futures, neutre pour les créneaux sans module (forum, projet…).
const EXTRA = ["#0f8b8d","#b5523b","#5a67d8","#9c6b30","#2e7d32","#ad3f8f"];
function colorFor(s){
  if (s.module && COLORS[s.module]) return COLORS[s.module];
  if (!s.module) return "#6b7a8c";
  let h = 0; for (const c of s.module) h = (h*31 + c.charCodeAt(0)) >>> 0;
  return EXTRA[h % EXTRA.length];
}

function layout(list){                    // colonnes pour les chevauchements
  const sorted=[...list].sort((a,b)=>a.s-b.s||a.e-b.e);
  const cols=[];
  sorted.forEach(ev=>{
    let placed=false;
    for(let i=0;i<cols.length;i++){
      if(cols[i][cols[i].length-1].e <= ev.s){ cols[i].push(ev); ev.col=i; placed=true; break; }
    }
    if(!placed){ ev.col=cols.length; cols.push([ev]); }
  });
  sorted.forEach(ev=>ev.ncols=cols.length);
  return sorted;
}

function sessionsOn(d){
  const k=ymd(d);
  return DATA.sessions.filter(s=>s.start.startsWith(k))
    .sort((a,b)=>a.start<b.start?-1:1);
}

// Sur un jour vide (week-end, vacances) on saute au prochain jour qui a cours.
function firstDayWithCourses(from){
  const d=new Date(from);
  for(let i=0;i<21;i++){ if(sessionsOn(d).length) return d; d.setDate(d.getDate()+1); }
  return from;
}

// Le jour à ouvrir : aujourd'hui tant qu'il reste un cours à venir,
// sinon on passe directement au prochain jour de cours.
function dayToOpen(){
  const now=new Date();
  const reste=sessionsOn(now).some(s=>parseLocal(s.end)>now);
  if(reste) return now;
  const d=new Date(now); d.setDate(d.getDate()+1);
  return firstDayWithCourses(d);
}

function renderDay(){
  const grid=document.getElementById("grid");
  const list=sessionsOn(cursor), now=new Date(), today=ymd(now);
  const f=new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  let t=f.format(cursor); t=t.charAt(0).toUpperCase()+t.slice(1);
  const dd=new Date(cursor), tm=new Date(); tm.setDate(tm.getDate()+1);
  let suffixe="";
  if(ymd(dd)===today) suffixe="  ·  aujourd'hui";
  else if(ymd(dd)===ymd(tm)) suffixe="  ·  demain";
  document.getElementById("range").textContent = t + suffixe;

  if(!list.length){ grid.innerHTML='<div class="empty">Aucun cours ce jour-là.</div>'; return; }

  let h='<div class="daylist">';
  list.forEach(s=>{
    const a=parseLocal(s.start), b=parseLocal(s.end);
    const prim=isPrimary(s), c=prim?colorFor(s):"var(--dim)";
    const isToday=ymd(cursor)===today;
    const ongoing=isToday && a<=now && now<b, past=isToday && b<=now;
    const cat=(s.category||"").replace("Contrôle continu","CC").replace("Réunion de pré-rentrée","Pré-rentrée");
    h+=`<div class="dcard${prim?"":" sec"}${ongoing?" ongoing":""}${past?" past":""}" style="--c:${c}">
      <div class="when"><b>${pad(a.getHours())}:${pad(a.getMinutes())}</b>${pad(b.getHours())}:${pad(b.getMinutes())}</div>
      <div class="bd">
        <div class="ttl">${labelFor(s)}</div>
        ${s.room?`<div class="sub">${s.room}${s.teacher?" · "+s.teacher:""}</div>`:(s.teacher?`<div class="sub">${s.teacher}</div>`:"")}
        ${cat?`<span class="bg" style="--bc:${catColor(cat)}">${cat}</span>`:""}
      </div></div>`;
  });
  grid.innerHTML=h+"</div>";
}

function render(){
  const grid=document.getElementById("grid");
  if(!DATA){ grid.innerHTML='<div class="empty">Chargement…</div>'; return; }
  document.body.classList.toggle("day", isNarrow());
  if(isNarrow()){ renderDay(); stampMeta(); return; }

  const start=mondayOf(cursor);
  const byDay={}; let maxDay=4;
  DATA.sessions.forEach(s=>{
    const sd=parseLocal(s.start), ed=parseLocal(s.end);
    const k=ymd(sd);
    (byDay[k]=byDay[k]||[]).push({...s,s:minutes(sd),e:minutes(ed),sd,ed});
  });
  for(let i=5;i<7;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    if((byDay[ymd(d)]||[]).length) maxDay=i;
  }
  const ndays=maxDay+1, hours=DAY_END-DAY_START;
  grid.style.gridTemplateColumns = "44px repeat("+ndays+", minmax(0,1fr))";
  document.documentElement.style.setProperty("--hours",hours);

  const end=new Date(start); end.setDate(end.getDate()+ndays-1);
  const fmt=new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"long"});
  document.getElementById("range").textContent=fmt.format(start)+" – "+fmt.format(end)+" "+end.getFullYear();

  let html='<div class="corner"></div>';
  const today=ymd(new Date());
  for(let i=0;i<ndays;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    const dw=new Intl.DateTimeFormat("fr-FR",{weekday:"short"}).format(d).replace(".","");
    html+=`<div class="dayhead${ymd(d)===today?" is-today":""}"><div class="dw">${dw}</div><div class="dd">${d.getDate()}</div></div>`;
  }
  html+='<div class="axis">';
  for(let h=DAY_START;h<=DAY_END;h++) html+=`<span style="top:${(h-DAY_START)*62}px">${h}h</span>`;
  html+='</div>';

  const nowD=new Date();
  for(let i=0;i<ndays;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    const key=ymd(d), isToday=key===today;
    html+=`<div class="col${isToday?" is-today":""}">`;
    for(let h=DAY_START;h<=DAY_END;h++) html+=`<div class="hline" style="top:${(h-DAY_START)*62}px"></div>`;
    if(isToday){
      const m=minutes(nowD);
      if(m>=DAY_START*60&&m<=DAY_END*60) html+=`<div class="now" style="top:${(m-DAY_START*60)/60*62}px"></div>`;
    }
    layout(byDay[key]||[]).forEach(ev=>{
      const top=(ev.s-DAY_START*60)/60*62, h=Math.max(22,(ev.e-ev.s)/60*62-3);
      const prim=isPrimary(ev), c=prim?colorFor(ev):"var(--dim)";
      const w=100/ev.ncols, left=ev.col*w;
      const cat=(ev.category||"").replace("Contrôle continu","CC").replace("Réunion de pré-rentrée","Pré-rentrée");
      html+=`<div class="ev${prim?"":" sec"}${h<46?" short":""}" style="--c:${c};top:${top}px;height:${h}px;left:calc(${left}% + 2px);width:calc(${w}% - 4px)" title="${(ev.title||"").replace(/"/g,"&quot;")}${ev.room?" — "+ev.room:""}">
        <div class="hd">
          <span class="t">${pad(ev.sd.getHours())}:${pad(ev.sd.getMinutes())}–${pad(ev.ed.getHours())}:${pad(ev.ed.getMinutes())}</span>
          ${cat?`<span class="b" style="--bc:${catColor(cat)}">${cat}</span>`:""}
        </div>
        <div class="n">${labelFor(ev)}</div>
        ${ev.room?`<div class="r">${ev.room}${ev.teacher?" · "+ev.teacher:""}</div>`:(ev.teacher?`<div class="r">${ev.teacher}</div>`:"")}
      </div>`;
    });
    html+="</div>";
  }
  grid.innerHTML=html;

  stampMeta();
}

function stampMeta(){
  if(!DATA || !DATA.fetchedAt) return;
  const f=new Date(DATA.fetchedAt);
  document.getElementById("meta").textContent="maj "+pad(f.getHours())+":"+pad(f.getMinutes());
}

function move(n){
  cursor=new Date(cursor);
  cursor.setDate(cursor.getDate() + (isNarrow() ? n : n*7));
  render();
}
addEventListener("resize", ()=>{ if(DATA) render(); });
document.getElementById("prev").onclick=()=>move(-1);
document.getElementById("next").onclick=()=>move(1);
document.getElementById("today").onclick=()=>{cursor=isNarrow()?dayToOpen():new Date();render();};
document.getElementById("togglesec").onclick=()=>{
  document.body.classList.toggle("hide-sec");
  try{localStorage.setItem("hideSec",document.body.classList.contains("hide-sec")?"1":"0")}catch(e){}
};
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")move(-1); else if(e.key==="ArrowRight")move(1);
  else if(e.key.toLowerCase()==="t"){cursor=new Date();render();}
});
try{ if(localStorage.getItem("hideSec")==="1") document.body.classList.add("hide-sec"); }catch(e){}

window.applyData = function(d){
  DATA=d;
  if(!cursor) cursor = isNarrow() ? dayToOpen() : new Date();
  render();
};
if(window.EDT_DATA) applyData(window.EDT_DATA);
else fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(applyData)
     .catch(()=>{document.getElementById("grid").innerHTML='<div class="empty">Aucune donnée.</div>';});
</script>
