# Met à jour data.json sans le Mac : connexion à Celcat, nettoyage, publication si utile.
# Complète la barre de menus du Mac (qui continue de publier de son côté) ; les deux
# appliquent la même règle (decide-publication.py), donc ne se marchent pas dessus.
#
# Dépôt PUBLIC : journaux lisibles par tous. Aucune étape ne doit afficher de contenu.
#
# À LA DEMANDE uniquement, jamais sur une horloge : c'est la page du téléphone qui lance
# ce workflow (à l'ouverture et au bouton ↻), puis attend sa fin pour recharger les données.
# Seul déclencheur : le lancement manuel. Les secrets ne sont donc jamais exposés à une PR
# venue d'ailleurs.
name: Mise à jour de l'emploi du temps

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maj
  cancel-in-progress: false

jobs:
  maj:
    # macOS et non Linux : même Swift et même Foundation que le Mac, donc un nettoyage
    # strictement identique. Un écart ferait republier chacun par-dessus l'autre.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer Celcat
        env:
          EDT_USER: ${{ secrets.EDT_USER }}
          EDT_PASSWORD: ${{ secrets.EDT_PASSWORD }}
        run: python3 outils/recuperer.py outils/EDTKit.swift "$RUNNER_TEMP/brut.json" profs.json

      # Quelqu'un attend devant son téléphone : on ne recompile que si le code a changé.
      - name: Retrouver le nettoyeur déjà compilé
        id: binaire
        uses: actions/cache@v4
        with:
          path: bin/edt-refresh
          key: edt-refresh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('outils/*.swift') }}

      - name: Compiler le nettoyeur
        if: steps.binaire.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          swiftc -O outils/EDTKit.swift outils/main.swift -o bin/edt-refresh

      - name: Nettoyer
        run: |
          SUP="$HOME/Library/Application Support/EDTUVSQ"
          mkdir -p "$SUP"
          # Le cache de départ est la version publiée : fetchedAt (dernier changement)
          # n'avance que si les séances changent vraiment.
          cp data.json "$SUP/data.json"
          bin/edt-refresh --from-file "$RUNNER_TEMP/brut.json"

      - name: Publier si utile
        run: |
          SUP="$HOME/Library/Application Support/EDTUVSQ"
          RAISON=$(python3 outils/decide-publication.py "$SUP/data.json" data.json)
          if [ "$RAISON" = "cache illisible" ]; then echo "cache illisible"; exit 1; fi
          [ -n "$RAISON" ] && cp "$SUP/data.json" data.json
          # profs.json (enseignants) suit sa propre vie : publié dès qu'il change.
          [ -f profs.json ] || echo '{}' > profs.json
          git add data.json profs.json
          if git diff --cached --quiet; then echo "rien de neuf"; exit 0; fi
          git diff --cached --quiet -- profs.json || RAISON="${RAISON:+$RAISON, }enseignants"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "maj $(TZ=Europe/Paris date '+%Y-%m-%d %H:%M') — $RAISON (sans le Mac)"
          # Si le Mac a publié entre-temps, on se recale ; en cas de conflit on abandonne,
          # le prochain passage repartira de la version à jour.
          git push -q origin HEAD:main || { git pull -q --rebase origin main && git push -q origin HEAD:main; }
          echo "publié : $RAISON"
